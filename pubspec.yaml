name: gym_saiyajin
description: "Aplicativo mobile offline-first para rastreamento de treinos de musculacao com tematica Saiyajin."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.11.4

dependencies:
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^21.0.0
  flutter_ringtone_player: ^4.0.0+4
  image_picker: ^1.2.3
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2
  timezone: ^0.11.0
  vibration: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
